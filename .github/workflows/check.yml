name: Check

# Type errors are caught here, not on players' machines (installed copies
# build with the type check off; see next.config.ts).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
