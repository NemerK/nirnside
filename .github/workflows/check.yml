name: Check

# Type errors are caught here, not on players' machines (installed copies
# build with the type check off; see next.config.ts).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Git identity for the self-update tests
        run: |
          git config --global user.name "Nirnside CI"
          git config --global user.email "ci@nirnside.invalid"
          git config --global init.defaultBranch main
      # The updater skips itself when CI is set; its tests need it to run.
      - run: npm test
        env:
          CI: ""
