name: Pack download

# Builds a Windows app (Nirnside.exe) and a zip on every push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The ready-built app the Windows launcher downloads and runs as is: built
  # and launch-tested on Windows here, so players never build anything.
  bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The runtime new installs download (the manifest pins it).
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npx next build
        env:
          NIRNSIDE_BUNDLE: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - run: node scripts/make-bundle.mjs ${{ github.sha }}
      - name: Zip
        shell: pwsh
        run: |
          Push-Location dist/bundle
          7z a -tzip -mx=7 ..\nirnside-win-x64.zip * | Out-Null
          Pop-Location
      - name: Launch test (unzipped elsewhere, data in its own folder)
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\nirnside-test"
          7z x dist\nirnside-win-x64.zip "-o$root\app" | Out-Null
          New-Item -ItemType Directory -Force "$root\data" | Out-Null
          $env:PORT = "43219"; $env:HOSTNAME = "127.0.0.1"; $env:NODE_ENV = "production"
          $env:NIRNSIDE_DB = "$root\data\nirnside.db"; $env:NIRNSIDE_INSTALL_ROOT = $root
          $p = Start-Process -FilePath node -ArgumentList "server.js" -WorkingDirectory "$root\app" -RedirectStandardOutput "$root\out.log" -RedirectStandardError "$root\err.log" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = (Invoke-WebRequest http://127.0.0.1:43219/api/health -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200 } catch {}
          }
          $fail = -not $ok
          foreach ($u in @("/", "/characters", "/party", "/setup")) {
            try { $r = Invoke-WebRequest ("http://127.0.0.1:43219" + $u) -UseBasicParsing -TimeoutSec 60 -MaximumRedirection 5; "$u -> $($r.StatusCode)" } catch { "$u -> FAILED: $($_.Exception.Message)"; $fail = $true }
          }
          if (-not (Test-Path "$root\data\nirnside.db")) { "database not created in the data folder"; $fail = $true }
          Stop-Process -Id $p.Id -Force
          Get-Content "$root\out.log", "$root\err.log"
          if ($fail) { exit 1 }
      - name: Manifest
        shell: pwsh
        run: |
          $zip = Get-Item dist\nirnside-win-x64.zip
          @{
            sha = "${{ github.sha }}"
            node = (node -v).Trim()
            sha256 = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
            size = $zip.Length
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM dist\nirnside-win-x64.json
          Get-Content dist\nirnside-win-x64.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            dist/nirnside-win-x64.zip
            dist/nirnside-win-x64.json
          overwrite_files: true

  pack:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test installer
        run: go test
        working-directory: installer
      - name: Build Windows app
        working-directory: installer
        run: |
          mkdir -p ../dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -H=windowsgui -X main.launcherCommit=$(git rev-parse --short HEAD)" -o ../dist/Nirnside.exe .

      # Code signing kills the SmartScreen "Windows protected your PC" warning.
      # Set the repo variable CODE_SIGNING=azure-trusted-signing and the six
      # secrets below (Azure Trusted Signing, ~$9.99/month; individual accounts
      # are supported) and every release exe is signed automatically.
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #   TRUSTED_SIGNING_ENDPOINT (e.g. https://eus.codesigning.azure.net),
      #   TRUSTED_SIGNING_ACCOUNT_NAME, TRUSTED_SIGNING_CERT_PROFILE
      # Uses the Azure CLI trusted-signing extension (preinstalled on runners)
      # exactly as in Microsoft's Trusted Signing quickstart — no third-party
      # action to resolve, so the pipeline stays green even while signing is
      # not configured.
      - name: Code sign the launcher (Azure Trusted Signing)
        if: vars.CODE_SIGNING == 'azure-trusted-signing'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
        run: |
          az extension add --name trusted-signing --yes
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          az trusted-signing \
            --endpoint "$TRUSTED_SIGNING_ENDPOINT" \
            --account-name "$TRUSTED_SIGNING_ACCOUNT_NAME" \
            --certificate-profile-name "$TRUSTED_SIGNING_CERT_PROFILE" \
            --file-path "$PWD/dist/Nirnside.exe" \
            --file-digest SHA256
      - name: Zip (no node_modules, no account data)
        run: |
          mkdir -p dist
          zip -r dist/nirnside.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x '.next/*' \
            -x 'data/*.db' \
            -x 'data/*.db-*' \
            -x 'data/incoming/*.lua' \
            -x '.nirnside-revision' \
            -x '.nirnside-restart' \
            -x 'dist/*' \
            -x 'installer/Nirnside.exe'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nirnside
          body: |
            **Windows:** download **Nirnside.exe** and double-click it.
            It installs Nirnside on this PC and opens the Nirnside launcher window. You do not install Node.js, Visual Studio, or Python.

            If Windows SmartScreen appears: More info → Run anyway.

            The zip + `start-nirnside.cmd` is for people who already have Node, and for macOS/Linux (`start-nirnside.sh`).

            Your `data` folder is never overwritten. Nirnside never uploads your account.
          files: |
            dist/Nirnside.exe
            dist/nirnside.zip
          make_latest: true
          overwrite_files: true
